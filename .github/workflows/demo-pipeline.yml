# Workflow de la demostración M04-00.
# Para verlo funcionar: cópialo a .github/workflows/demo-pipeline.yml en la raíz del repositorio.
name: Demo pipeline

on:
  push:
    paths:
      - 'ejercicios/M04-00-un-pipeline-de-pruebas/**'
      - '.github/workflows/demo-pipeline.yml'
  pull_request:
    paths:
      - 'ejercicios/M04-00-un-pipeline-de-pruebas/**'
      - '.github/workflows/demo-pipeline.yml'

jobs:
  unitarias:
    name: Unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: ejercicios/M04-00-un-pipeline-de-pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        working-directory: .

      - name: Ejecutar las pruebas unitarias
        run: npx vitest run
